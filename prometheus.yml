global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Next.js Application Metrics
  - job_name: "nextjs-app"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/api/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Database Metrics (if you have separate DB monitoring)
  - job_name: "postgres"
    static_configs:
      - targets: ["host.docker.internal:5432"]
    scrape_interval: 30s
    scrape_timeout: 10s
